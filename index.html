<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Responsive Newegg redesign prototype for an interaction design course." />
  <title>Newegg Redesign | Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>

<body class="page-home">
<a class="skip-link" href="#main-content">Skip to content</a>

  <header class="site-header">
    <div class="header-main shell">
      <button class="hamburger" type="button" data-menu-toggle aria-label="Open navigation" aria-expanded="false"><i
          class="fa-solid fa-bars"></i></button>
      <a class="brand" href="index.html" aria-label="Newegg redesign home"><span class="brand-orbs"
          aria-hidden="true"><i></i><i></i><i></i></span><span class="brand-word">newegg<span>+</span></span></a>
      <form class="search-form desktop-search" data-search-form>
        <label class="sr-only" for="desktop-search">Search products</label>
        <div class="search-input-wrap"><i class="fa-solid fa-magnifying-glass"></i><input id="desktop-search"
            name="query" value="Gaming laptop" placeholder="Search products" /></div>
        <button class="btn btn-primary" type="submit">Search</button>
      </form>
      <div class="header-actions">
        <button class="theme-control" type="button" data-theme-toggle aria-label="Switch color theme"><span
            class="theme-label">Dark mode</span><span class="switch"><i></i></span><span class="theme-icon"><i
              class="fa-regular fa-sun"></i></span></button>
        <a class="account-link desktop-only" href="support.html"><i
            class="fa-regular fa-user"></i><span>Account</span></a>
        <a class="cart-link" href="product.html" aria-label="Cart"><i class="fa-solid fa-cart-shopping"></i><span
            class="desktop-only">Cart</span><b class="cart-count" hidden>0</b></a>
      </div>
    </div>
    <div class="mobile-search shell">
      <form class="search-form" data-search-form>
        <label class="sr-only" for="mobile-search">Search products</label>
        <div class="search-input-wrap"><i class="fa-solid fa-magnifying-glass"></i><input id="mobile-search"
            name="query" value="Gaming laptop" placeholder="Search products" /></div>
        <button class="btn btn-primary" type="submit">Search</button>
      </form>
    </div>


</body>

</html>

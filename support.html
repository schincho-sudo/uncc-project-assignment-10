<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Support form for the Newegg redesign prototype." />
  <title>Newegg Redesign | Support</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
  rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>

<body class="page-support">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <div class="header-main shell"><button class="hamburger" type="button" data-menu-toggle aria-label="Open navigation"
        aria-expanded="false"><i class="fa-solid fa-bars"></i></button><a class="brand" href="index.html" aria-label="Newegg home">
        <img class="brand-logo" src="./assets/NeweggLogo.png" alt="Newegg" />
      </a>
      <form class="search-form desktop-search" data-search-form><label class="sr-only" for="desktop-search">Search
          products</label>
        <div class="search-input-wrap"><i class="fa-solid fa-magnifying-glass"></i><input id="desktop-search"
            name="query" placeholder="Search products" /></div><button class="btn btn-primary"
          type="submit">Search</button>
      </form>
      <div class="header-actions"><button class="theme-control" type="button" data-theme-toggle><span
            class="theme-label">Dark mode</span><span class="switch"><i></i></span><span class="theme-icon"><i
              class="fa-regular fa-sun"></i></span></button><a class="account-link desktop-only" href="support.html"><i
            class="fa-regular fa-user"></i><span>Account</span></a><a class="cart-link" href="product.html"
          aria-label="Cart"><i class="fa-solid fa-cart-shopping"></i><span class="desktop-only">Cart</span><b
            class="cart-count" hidden>0</b></a></div>
    </div>
    <div class="mobile-search shell">
      <form class="search-form" data-search-form><label class="sr-only" for="mobile-search">Search products</label>
        <div class="search-input-wrap"><i class="fa-solid fa-magnifying-glass"></i><input id="mobile-search"
            name="query" placeholder="Search products" /></div><button class="btn btn-primary"
          type="submit">Search</button>
      </form>
    </div>
    <nav class="desktop-nav" aria-label="Primary navigation">
      <div class="shell nav-inner"><a class="nav-link" href="index.html"><i
            class="fa-solid fa-bars"></i><span>Categories</span></a><a class="nav-link" href="search.html"><i
            class="fa-solid fa-microchip"></i><span>PC Builder</span></a><a class="nav-link" href="search.html"><i
            class="fa-solid fa-tag"></i><span>Deals</span></a><a class="nav-link is-active" href="support.html"><i
            class="fa-solid fa-headset"></i><span>Support</span></a><a class="nav-link" href="index.html"><i
            class="fa-solid fa-plus"></i><span>More</span></a></div>
    </nav>
    <div class="mobile-menu" aria-hidden="true">
      <div class="mobile-menu__backdrop" data-menu-close></div>
      <nav class="mobile-menu__panel" aria-label="Mobile navigation">
        <p>Explore</p><a class="mobile-nav-link" href="index.html"><i
            class="fa-solid fa-display"></i><span>Home</span><i class="fa-solid fa-arrow-right"></i></a><a
          class="mobile-nav-link" href="search.html"><i class="fa-solid fa-magnifying-glass"></i><span>Search
            products</span><i class="fa-solid fa-arrow-right"></i></a><a class="mobile-nav-link" href="product.html"><i
            class="fa-solid fa-laptop"></i><span>Product details</span><i class="fa-solid fa-arrow-right"></i></a><a
          class="mobile-nav-link is-active" href="support.html"><i
            class="fa-solid fa-headset"></i><span>Support</span><i class="fa-solid fa-arrow-right"></i></a><button
          class="mobile-menu__theme" type="button" data-theme-toggle><i class="fa-regular fa-moon"></i> Switch to dark
          mode</button>
      </nav>
    </div>
  </header>
  <main id="main-content" class="page">
    <section class="support-page shell" data-support-view>
      <div class="form-intro"><span class="eyebrow-dot"></span><span>We’re here to help</span>
        <h1>Support Request Form</h1>
        <p>Send your question to our team. Fields marked with <b>*</b> are required.</p>
      </div>
      <form class="support-form" data-support-form novalidate>
        <div class="form-field"><label for="name">Name <b>*</b></label><input id="name" name="name" type="text"
            placeholder="Enter your full name" />
          <p class="field-message" hidden></p>
        </div>
        <div class="form-field"><label for="email">Email <b>*</b></label><input id="email" name="email" type="email"
            placeholder="name@example.com" />
          <p class="field-message" hidden></p>
        </div>
        <div class="form-field"><label for="message">Message <b>*</b></label><textarea id="message" name="message"
            placeholder="Describe your issue or question..."></textarea>
          <p class="field-message" hidden></p>
        </div>
        <button class="btn btn-primary support-submit" type="submit">Submit request <i
            class="fa-solid fa-arrow-right"></i></button>
      </form>
    </section>
